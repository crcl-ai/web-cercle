name = "capsule-invite-ticket"
main = "invite-ticket.js"
compatibility_date = "2026-08-01"

# Only invitation links and the domain association go through the Worker.
# GitHub Pages serves every ordinary sruper.com request directly.
routes = [
  { pattern = "sruper.com/i/*", zone_name = "sruper.com" },
  { pattern = "sruper.com/.well-known/apple-app-site-association", zone_name = "sruper.com" }
]
