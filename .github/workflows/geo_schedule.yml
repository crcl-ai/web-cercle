name: Circle discovery quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discovery-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-discovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify generated discovery assets
        run: python3 agent/build_discovery_assets.py --check

      - name: Run public-copy and technical gates
        run: python3 agent/quality_gate.py

      - name: Verify the legacy GEO inventory
        run: python3 agent/geo_audit.py --check
